<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Weight Loss Plan</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

.container{
max-width:600px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:10px;
}

p{
text-align:center;
margin-bottom:25px;
color:#555;
}

.step{
display:none;
}

.step.active{
display:block;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
}

button{
margin-top:25px;
width:100%;
padding:14px;
background:#28a745;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#000;
}

.progress{
height:8px;
background:#ddd;
border-radius:5px;
margin-bottom:25px;
overflow:hidden;
}

.bar{
height:100%;
width:50%;
background:#28a745;
transition:.4s;
}

.small{
font-size:13px;
color:#777;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="step active" id="step1">

<h1>Free Weight Loss Assessment</h1>

<p>Answer 2 quick questions to see a supplement that may suit your goals.</p>

<label>Age</label>
<input type="number" placeholder="Your Age">

<label>Gender</label>
<select>
<option>Male</option>
<option>Female</option>
</select>

<button onclick="nextStep()">Continue</button>

</div>

<div class="step" id="step2">

<h1>Almost Done!</h1>

<label>How much weight would you like to lose?</label>

<select>
<option>5-10 lbs</option>
<option>10-20 lbs</option>
<option>20-40 lbs</option>
<option>40+ lbs</option>
</select>

<label>Your biggest challenge?</label>

<select>
<option>Slow metabolism</option>
<option>Cravings</option>
<option>Lack of energy</option>
<option>Busy schedule</option>
</select>

<button onclick="redirectOffer()">
View My Recommendation
</button>

<p class="small">
Results vary from person to person. This questionnaire is informational and not medical advice.
</p>

</div>

</div>

<script>

function nextStep(){

document.getElementById("step1").classList.remove("active");
document.getElementById("step2").classList.add("active");

document.getElementById("bar").style.width="100%";

}

function redirectOffer(){

window.location.href="https://YOUR-CLICKBANK-HOPLINK.com";

}

</script>

</body>
</html>
