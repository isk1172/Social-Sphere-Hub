<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Contact Form</title>
  <!-- Bootstrap CSS CDN link -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .container {
      max-width: 600px;
      margin: 100px auto;
      text-align: center;
    }

    .thank-you {
      color: #28a745;
      font-size: 48px;
      font-weight: bold;
    }

    .message {
      margin-top: 20px;
      font-size: 18px;
      color: #6c757d;
    }

    .back-home {
      margin-top: 30px;
    }

    .back-home a {
      text-decoration: none;
      color: #007bff;
      font-weight: bold;
    }

    .back-home a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="thank-you">Thank You!</div>
    <div class="message">Your message has been successfully sent.</div>
    <div class="back-home">
      <a href="index.html">Back to Home</a>
    </div>
  </div>

</body>
</html>
