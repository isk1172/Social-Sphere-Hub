<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    background:#f5f5f5;
    text-align:center;
}

.image-container{
    position:relative;
    display:inline-block;
}

.image-container img{
    width:auto;          /* Show original width */
    max-width:none;      /* Don't limit the width */
    height:auto;
    display:block;
}

/* Clickable hotspot */
.hotspot{
    position:absolute;

    left:3%;
    bottom:3.5%;
    width:38%;
    height:11%;

    border:4px solid #FFD700;
    border-radius:12px;

    cursor:pointer;

    animation:pulse 1.6s infinite;
}

@keyframes pulse{

0%{
    box-shadow:0 0 0 0 rgba(255,215,0,.8);
    transform:scale(1);
}

50%{
    box-shadow:0 0 25px 12px rgba(255,215,0,.4);
    transform:scale(1.03);
}

100%{
    box-shadow:0 0 0 0 rgba(255,215,0,0);
    transform:scale(1);
}

}
</style>
</head>

<body>

<div class="image-container">

<img src="img/woodtest.png" alt="Woodworking">

<a class="hotspot"
href="https://db351evb70ay0obrr6xe-9zlfq.hop.clickbank.net"
target="_blank"></a>

</div>

</body>
</html>
